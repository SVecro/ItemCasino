plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

// Mojang ships Java 21 to end users in 1.21.11, so mods must target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            // INFO, not DEBUG: a DEBUG game-test run wrote five megabytes of registry chatter around
            // the dozen lines anyone reads. Raise it locally when chasing something.
            logLevel = org.slf4j.event.Level.INFO
        }

    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}


// The game-test datapack entries ship. A `test_instance` entry whose schema is even slightly wrong
// fails to parse, and a mod's built-in datapack that fails to parse stops the world from loading at
// all -- so these are only allowed in once `runGameTestServer` has actually loaded and run them.
// They are inert in a normal game: nothing references a test function unless a test is started.

dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly   "org.junit.platform:junit-platform-launcher"
}

// The pure core (com.itemcasino.core.**) contains no Minecraft types on purpose,
// so these tests run without a game instance.
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events "passed", "skipped", "failed" }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

idea { module { downloadSources = true; downloadJavadoc = true } }
